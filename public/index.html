<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sweet Roses</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // The messenger's bridge script is loaded WITHOUT blocking the page: on some mobile networks telegram.org hangs,
    // and a blocking script would leave the app on Telegram's loading bar forever. The app starts when the bridge
    // has loaded, failed, or after a short wait — then, for Telegram, a small built-in stand-in is used.
    (function () {
      var h = location.hash + location.search;
      var isMax = /WebAppData=/.test(h) && !/tgWebAppData=/.test(h);
      window.__bridgeReady = new Promise(function (resolve) {
        var done = false, fin = function () { if (!done) { done = true; resolve(); } };
        var s = document.createElement("script");
        s.src = isMax ? "https://st.max.ru/js/max-web-app.js" : "https://telegram.org/js/telegram-web-app.js";
        s.async = true; s.onload = fin; s.onerror = fin;
        document.head.appendChild(s);
        setTimeout(fin, isMax ? 5000 : 2500);
      });
      // Stand-in for telegram-web-app.js: launch data from the address, events to Telegram the same way the real script sends them.
      window.__tgStandIn = function () {
        var m = /[#&]tgWebAppData=([^&]*)/.exec(location.hash);
        if (!m) return null;
        var raw = decodeURIComponent(m[1]), user = null, theme = {};
        try { user = JSON.parse(new URLSearchParams(raw).get("user")); } catch (e) {}
        try { var t = /[#&]tgWebAppThemeParams=([^&]*)/.exec(location.hash); if (t) theme = JSON.parse(decodeURIComponent(t[1])); } catch (e) {}
        var post = function (type, data) {
          try {
            if (window.TelegramWebviewProxy) return window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data || {}));
            if (window.external && "notify" in window.external) return window.external.notify(JSON.stringify({ eventType: type, eventData: data || {} }));
            window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || {} }), "*");
          } catch (e) {}
        };
        var backCbs = [];
        window.Telegram = window.Telegram || {};
        window.Telegram.WebView = { receiveEvent: function (type) { if (type === "back_button_pressed") backCbs.forEach(function (f) { f(); }); } };
        window.TelegramGameProxy = { receiveEvent: window.Telegram.WebView.receiveEvent };
        var bg = String(theme.bg_color || "#ffffff").replace("#", ""), lum = parseInt(bg.slice(0, 2), 16) + parseInt(bg.slice(2, 4), 16) + parseInt(bg.slice(4, 6), 16);
        var noop = function () {};
        return {
          initData: raw, initDataUnsafe: { user: user }, colorScheme: lum < 384 ? "dark" : "light", platform: "unknown", standIn: true,
          ready: function () { post("web_app_ready"); }, expand: function () { post("web_app_expand"); },
          onEvent: noop, setHeaderColor: noop, setBackgroundColor: noop,
          BackButton: { show: function () { post("web_app_setup_back_button", { is_visible: true }); }, hide: function () { post("web_app_setup_back_button", { is_visible: false }); }, onClick: function (f) { backCbs.push(f); } },
          HapticFeedback: { impactOccurred: function (s) { post("web_app_trigger_haptic_feedback", { type: "impact", impact_style: s || "light" }); }, notificationOccurred: function (s) { post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: s }); } },
          openLink: function (u) { post("web_app_open_link", { url: u }); },
          openTelegramLink: function (u) { var x = new URL(u); post("web_app_open_tg_link", { path_full: x.pathname + x.search }); },
          showConfirm: function (q, cb) { cb(window.confirm(q)); }
        };
      };
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner glass">
      <a class="icon-btn" id="topLeft" href="tel:+79086667202" aria-label="Позвонить">
        <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
      </a>
      <a class="monogram" href="#/" aria-label="Sweet Roses — на главную">S<i></i>R</a>
      <button class="icon-btn" id="topRight" aria-label="Поиск" data-action="go" data-to="#/catalog/all?search=1">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabbar glass" aria-label="Разделы">
    <button class="tab" data-tab="home" data-action="go" data-to="#/">
      <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>Главная
    </button>
    <button class="tab" data-tab="catalog" data-action="go" data-to="#/catalog/all">
      <svg viewBox="0 0 24 24"><path d="M12 21c-4-1.5-7-5-7-9.5C5 8 7.5 6 12 6s7 2 7 5.5c0 4.5-3 8-7 9.5Z"/><path d="M9 3.5c1 1.2 2 1.8 3 2.5 1-.7 2-1.3 3-2.5"/></svg>Каталог
    </button>
    <button class="tab" data-tab="cart" data-action="go" data-to="#/cart">
      <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Корзина<span class="badge" id="cartBadge" hidden>0</span>
    </button>
    <button class="tab" data-tab="profile" data-action="go" data-to="#/profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>Профиль
    </button>
    <button class="tab" data-tab="contacts" data-action="go" data-to="#/contacts">
      <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11Z"/><circle cx="12" cy="10" r="2.2"/></svg>Контакты
    </button>
  </nav>

  <div class="toast glass" id="toast" role="status"></div>

  <script src="pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
